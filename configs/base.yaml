# Base configuration for LR2 (full experiment).
# Widths and subsample are tuned after the epoch-time benchmark (make bench).
seed: 42
num_threads: 8

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  artifacts_dir: artifacts

data:
  # Full 60k gives ~168 s/epoch on CPU; subsampling to 30k (class-proportional)
  # brings one epoch to ~56 s, within the ~60-75 s budget (see PLAN / report).
  subsample_size: 30000

model:
  latent_dim: 100
  # Widths tuned from the epoch-time benchmark: g_base/d_base=48 -> ~56 s/epoch
  # (G ~545k params, D ~80k). 64/64 was ~168 s/epoch (over budget).
  g_base: 48
  d_base: 48
  classifier_base: 32

gan:
  epochs: 18
  batch_size: 256
  learning_rate: 0.0002
  beta1: 0.5
  beta2: 0.999
  label_smoothing_real: 0.9
  n_fixed_samples: 64

classifier:
  epochs: 5
  batch_size: 256
  learning_rate: 0.001

evaluation:
  num_generated: 10000
  precision_recall_k: 3
  umap_points: 3000
  memorization_sample: 500
  low_confidence_threshold: 0.6
  dropped_class_threshold: 0.02

imbalance:
  drop_classes: [5, 8, 9]   # Sandal, Bag, Ankle boot
  drop_fraction: 0.95

poison:
  poison_class: 0           # T-shirt/top
  epsilons: [0.05, 0.20]
  trigger_size: 4
  trigger_value: 1.0
  detection_threshold: 0.5
